[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "la-caja"
version = "0.7.0"
description = "Memoria contextual asociativa para modelos de lenguaje: observacion, olvido, discriminacion recuerdo/inferencia y primado de contexto."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Miguel Okstein", email = "deviceargent@users.noreply.github.com" },
]
keywords = ["memoria", "contexto", "asociativa", "llm", "falsacion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
[project.urls]
Homepage = "https://github.com/deviceargent/La-Caja"
Repository = "https://github.com/deviceargent/La-Caja"
Documentation = "https://github.com/deviceargent/La-Caja/blob/main/experiments/writeup.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]