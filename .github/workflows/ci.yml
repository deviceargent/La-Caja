name: CI

on:
  push:
    branches: [testing, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[cartografia]" pytest ruff
      - name: Analisis estatico
        run: ruff check src/la_caja/cli.py src/la_caja/core.py tests/test_cli.py tests/test_core.py
      - name: Suite de propiedades
        run: python -m pytest tests -q
      - name: Construir wheel
        run: python -m build --wheel
      - name: Probar wheel en entorno limpio
        run: |
          python -m venv .wheel-venv
          wheel=$(ls dist/*.whl)
          .wheel-venv/bin/pip install "${wheel}[cartografia]" pytest
          .wheel-venv/bin/python -m pytest tests -q
          .wheel-venv/bin/la-caja --help
