[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "la-caja"
version = "0.2.0"
description = "La Caja: memoria contextual asociativa con olvido, confianza y primado de contexto."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]